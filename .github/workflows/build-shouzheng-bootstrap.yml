name: Build ShouZheng 0.0.1

on:
  push:
    branches:
      - build-shouzheng-0.0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v5

      - name: Reconstruct and patch source project
        shell: bash
        run: |
          set -euo pipefail
          cat ci_payload/ShouZheng.part* > /tmp/ShouZheng-0.0.1-source.tar.gz.b64
          base64 --decode /tmp/ShouZheng-0.0.1-source.tar.gz.b64 > /tmp/ShouZheng-0.0.1-source.tar.gz
          echo "8f925bb63ce0eb7b4449f9e967860fba079f200541730481e7247ee4fec13b2e  /tmp/ShouZheng-0.0.1-source.tar.gz" | sha256sum --check --strict
          mkdir -p project
          tar -xzf /tmp/ShouZheng-0.0.1-source.tar.gz -C project
          python3 - <<'PY'
          from pathlib import Path

          build_path = Path("project/app/build.gradle.kts")
          build_text = build_path.read_text(encoding="utf-8")
          old = '''    kotlinOptions {
                  jvmTarget = "17"
              }

          '''
          if old not in build_text:
              raise SystemExit("Expected legacy kotlinOptions block was not found")
          build_text = build_text.replace(old, "", 1)
          marker = "\ndependencies {\n"
          block = '''
          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          '''
          if marker not in build_text:
              raise SystemExit("Dependencies marker was not found")
          build_text = build_text.replace(marker, block + marker, 1)
          build_path.write_text(build_text, encoding="utf-8")

          theme_path = Path("project/app/src/main/res/values-v31/themes.xml")
          theme_text = theme_path.read_text(encoding="utf-8")
          bad_item = '        <item name="android:postSplashScreenTheme">@style/Theme.ShouZheng</item>\n'
          if bad_item not in theme_text:
              raise SystemExit("Expected invalid splash-screen item was not found")
          theme_path.write_text(theme_text.replace(bad_item, "", 1), encoding="utf-8")

          repository_path = Path("project/app/src/main/java/com/colion/shouzheng/data/AppRepository.kt")
          repository_text = repository_path.read_text(encoding="utf-8")
          repository_text = repository_text.replace(
              "fun setGoalDays(value: Int)",
              "fun updateGoalDays(value: Int)",
              1,
          ).replace(
              "fun setThemeMode(value: ThemeMode)",
              "fun updateThemeMode(value: ThemeMode)",
              1,
          )
          repository_path.write_text(repository_text, encoding="utf-8")

          me_path = Path("project/app/src/main/java/com/colion/shouzheng/ui/MeScreen.kt")
          me_text = me_path.read_text(encoding="utf-8")
          me_text = me_text.replace(
              "repository.setGoalDays(days)",
              "repository.updateGoalDays(days)",
              1,
          ).replace(
              "repository.setThemeMode(mode)",
              "repository.updateThemeMode(mode)",
              1,
          )
          me_path.write_text(me_text, encoding="utf-8")
          PY
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/java/com/colion/shouzheng/MainActivity.kt
          ! grep -R "repository.setGoalDays\|repository.setThemeMode" project/app/src/main/java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Generate Gradle wrapper
        working-directory: project
        run: gradle wrapper --gradle-version 8.13

      - name: Run tests lint and build APK
        working-directory: project
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK identity permissions and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/SIGNATURE.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/APKINFO.txt
          "$BUILD_TOOLS/aapt" dump permissions "$APK" | tee /tmp/PERMISSIONS.txt
          grep -Fq "package: name='com.colion.shouzheng' versionCode='1' versionName='0.0.1'" /tmp/APKINFO.txt
          grep -Fq "sdkVersion:'26'" /tmp/APKINFO.txt
          grep -Fq "targetSdkVersion:'36'" /tmp/APKINFO.txt
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/SIGNATURE.txt
          if grep -Fq "android.permission.INTERNET" /tmp/PERMISSIONS.txt; then
            echo "Unexpected INTERNET permission detected" >&2
            exit 1
          fi

      - name: Prepare deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          cp project/app/build/outputs/apk/debug/app-debug.apk dist/ShouZheng-0.0.1-debug.apk
          cp /tmp/APKINFO.txt dist/APKINFO.txt
          cp /tmp/PERMISSIONS.txt dist/PERMISSIONS.txt
          cp /tmp/SIGNATURE.txt dist/SIGNATURE.txt
          cp project/app/build/reports/lint-results-debug.txt dist/LINT_REPORT.txt
          rsync -a \
            --exclude '.gradle/' \
            --exclude '.idea/' \
            --exclude '.kotlin/' \
            --exclude 'build/' \
            --exclude 'app/build/' \
            project/ dist/source/
          (cd dist/source && zip -q -r ../ShouZheng-0.0.1-source.zip .)
          rm -rf dist/source
          cat > dist/BUILD_REPORT.txt <<EOF
          App: ShouZheng
          Version: 0.0.1 (1)
          Package: com.colion.shouzheng
          Minimum SDK: 26
          Target SDK: 36
          Java: 17
          Gradle: 8.13
          Android Gradle Plugin: 8.13.2
          Kotlin: 2.3.20
          Checks: unit tests, Android Lint, APK ZIP integrity, package/version identity, permission audit, APK v2 signature verification
          Workflow run: $GITHUB_RUN_ID
          Commit: $GITHUB_SHA
          EOF
          (cd dist && sha256sum ShouZheng-0.0.1-debug.apk ShouZheng-0.0.1-source.zip APKINFO.txt PERMISSIONS.txt SIGNATURE.txt LINT_REPORT.txt BUILD_REPORT.txt > SHA256SUMS.txt)
          unzip -t dist/ShouZheng-0.0.1-debug.apk
          unzip -t dist/ShouZheng-0.0.1-source.zip
          ls -lh dist

      - name: Upload APK source and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: ShouZheng-0.0.1
          path: dist/*
          if-no-files-found: error
          retention-days: 30
