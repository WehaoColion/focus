name: Build ShouZheng 0.0.1

on:
  push:
    branches:
      - build-shouzheng-0.0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v5

      - name: Reconstruct and patch source project
        shell: bash
        run: |
          set -euo pipefail
          cat ci_payload/ShouZheng.part* > /tmp/ShouZheng-0.0.1-source.tar.gz.b64
          base64 --decode /tmp/ShouZheng-0.0.1-source.tar.gz.b64 > /tmp/ShouZheng-0.0.1-source.tar.gz
          echo "8f925bb63ce0eb7b4449f9e967860fba079f200541730481e7247ee4fec13b2e  /tmp/ShouZheng-0.0.1-source.tar.gz" | sha256sum --check --strict
          mkdir -p project
          tar -xzf /tmp/ShouZheng-0.0.1-source.tar.gz -C project
          python3 - <<'PY'
          from pathlib import Path

          build_path = Path("project/app/build.gradle.kts")
          build_text = build_path.read_text(encoding="utf-8")
          old = '''    kotlinOptions {
                  jvmTarget = "17"
              }

          '''
          if old not in build_text:
              raise SystemExit("Expected legacy kotlinOptions block was not found")
          build_text = build_text.replace(old, "", 1)
          marker = "\ndependencies {\n"
          block = '''
          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          '''
          if marker not in build_text:
              raise SystemExit("Dependencies marker was not found")
          build_text = build_text.replace(marker, block + marker, 1)
          build_path.write_text(build_text, encoding="utf-8")

          theme_path = Path("project/app/src/main/res/values-v31/themes.xml")
          theme_text = theme_path.read_text(encoding="utf-8")
          bad_item = '        <item name="android:postSplashScreenTheme">@style/Theme.ShouZheng</item>\n'
          if bad_item not in theme_text:
              raise SystemExit("Expected invalid splash-screen item was not found")
          theme_path.write_text(theme_text.replace(bad_item, "", 1), encoding="utf-8")
          PY
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/java/com/colion/shouzheng/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Generate Gradle wrapper
        working-directory: project
        run: gradle wrapper --gradle-version 8.13

      - name: Run unit tests and build APK
        working-directory: project
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Prepare deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          cp project/app/build/outputs/apk/debug/app-debug.apk dist/ShouZheng-0.0.1-debug.apk
          rsync -a \
            --exclude '.gradle/' \
            --exclude '.idea/' \
            --exclude 'build/' \
            --exclude 'app/build/' \
            project/ dist/source/
          (cd dist/source && zip -q -r ../ShouZheng-0.0.1-source.zip .)
          rm -rf dist/source
          (cd dist && sha256sum ShouZheng-0.0.1-debug.apk ShouZheng-0.0.1-source.zip > SHA256SUMS.txt)
          unzip -t dist/ShouZheng-0.0.1-debug.apk
          ls -lh dist

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: ShouZheng-0.0.1
          path: dist/*
          if-no-files-found: error
          retention-days: 30
